plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'software.amazon.awscdk:aws-cdk-lib:2.235.1'
    implementation 'software.constructs:constructs:[10.0.0,11.0.0)'
    // PipelineConfig reads the pipeline's JSON settings; the CDK runtime already brings this version.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    // Evaluates the release state machine's JSONata in tests, as mpd-api does.
    testImplementation 'com.dashjoin:jsonata:0.9.10'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

group = 'com.mpd.sendrec.infrastructure'
version = '0.1'
description = 'SendRec on AWS for MPD'
java.sourceCompatibility = '21'

application {
    mainClass = 'com.mpd.sendrec.infrastructure.SendRecApp'
}

test {
    useJUnitPlatform()
}
