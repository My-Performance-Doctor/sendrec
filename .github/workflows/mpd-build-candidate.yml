name: MPD immutable candidate
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: mpd-image-candidate
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.MPD_STAGING_BUILD_ROLE_ARN }}
          aws-region: ap-southeast-2
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Require immutable repository tags
        env:
          REPOSITORY: ${{ vars.MPD_ECR_REPOSITORY }}
        run: |
          aws ecr describe-repositories --repository-names "$REPOSITORY" --query 'repositories[0].imageTagMutability' --output text > "$RUNNER_TEMP/tag-policy"
          test "$(cat "$RUNNER_TEMP/tag-policy")" = IMMUTABLE
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64
          labels: org.opencontainers.image.revision=${{ github.sha }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.MPD_ECR_REPOSITORY }}:${{ github.sha }}
      - name: Record immutable candidate, without deploying
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.MPD_ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json,os
          with open('image-candidate.json','w') as stream:
              json.dump({'revision':os.environ['GITHUB_SHA'],'image':os.environ['IMAGE'],'stagingVerified':False},stream,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: immutable-candidate
          path: image-candidate.json
