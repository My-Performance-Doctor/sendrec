name: AWS infrastructure
on:
  pull_request:
    paths:
      - 'infrastructure/**'
      - 'docker-entrypoint.sh'
      - '.github/workflows/aws-infrastructure.yml'
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - 'docker-entrypoint.sh'
      - '.github/workflows/aws-infrastructure.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Entrypoint checks
        run: python3 -B -m unittest discover -s infrastructure/tests -v
      - name: Bootstrap access checks
        working-directory: infrastructure
        run: node tests/test_bootstrap_access.cjs
      - name: Infrastructure assertions
        working-directory: infrastructure
        run: ./gradlew test
